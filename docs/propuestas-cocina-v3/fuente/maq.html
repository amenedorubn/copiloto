<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Maquetas Cocina</title>
<style>
@font-face{font-family:Manrope;src:url("../../../fonts/Manrope.woff2") format("woff2");font-weight:200 800}
:root{--bg:#0a0b0d;--fg:#f4f5f7;--mu:#8e939b;--sf:#15171b;--sf2:#1c1f24;--ln:rgba(255,255,255,.08);--ac:#f08a4b;--onac:#0a0b0d;--wait:rgba(244,245,247,.22)}
:root[data-tema=claro]{--bg:#f6f6f4;--fg:#141518;--mu:#5b6069;--sf:#fdfdfb;--sf2:#ebebe7;--ln:rgba(0,0,0,.09);--ac:#b3541e;--onac:#fdfdfb;--wait:rgba(20,21,24,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{width:390px;height:844px;overflow:hidden;position:relative}
#tel{position:absolute;inset:0;padding:14px 16px 0;display:flex;flex-direction:column}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
svg.i.s{width:16px;height:16px}svg.i.l{width:24px;height:24px}
.cab{display:flex;align-items:center;gap:4px;height:52px;margin:0 -8px}
.cab .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.cab small{display:block;font-size:12px;font-weight:600;color:var(--mu);line-height:1.3}
.cab b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.cab .der{margin-left:auto}
.seg{display:flex;background:var(--sf);border-radius:16px;padding:4px;gap:2px;margin:8px 0 0}
.seg span{flex:1;height:40px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:700;color:var(--mu);border-radius:12px}
.seg span.on{background:var(--fg);color:var(--bg)}
.seg span em{font-style:normal;font-size:12px;opacity:.8}
.cuerpo{flex:1;overflow:hidden;padding-top:8px;position:relative}
.cap{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0;line-height:1.5}
.cap.ac{color:var(--ac)}
.g{margin-top:32px}.g1{margin-top:12px}.g0{margin-top:8px}
.caja{background:var(--sf);border-radius:18px;padding:12px 14px}
.fila{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--ln)}
.fila:first-child{border-top:0}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-size:15px;font-weight:700;line-height:1.35}
.fila .t small{display:block;font-size:12px;font-weight:600;color:var(--mu);line-height:1.5}
.fila .n{font-size:15px;font-weight:700;white-space:nowrap}
.fila .h{width:64px;font-size:13px;font-weight:700;color:var(--mu);line-height:1.3}
.mu{color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--sf2);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg)}
.btn{height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;background:var(--sf2);color:var(--fg)}
.btn.inv{background:var(--fg);color:var(--bg)}
.btn.ac{background:var(--ac);color:var(--onac)}
.btn.min{height:44px;font-size:14px;padding:0 14px;border-radius:14px}
.pie{padding:12px 0 22px;display:flex;gap:8px}
.pie .btn{flex:1}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.reloj{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.p{font-size:15px;font-weight:600;line-height:1.5;margin:0}
.ps{font-size:13px;font-weight:600;line-height:1.5;margin:0;color:var(--mu)}
.barra{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--fg);border-radius:3px}
.sk{background:var(--sf2);border-radius:8px}
.aviso{display:flex;gap:12px;align-items:flex-start}
.aviso .i{margin-top:2px}
.hoja{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:24px 24px 0 0;padding:8px 16px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.hoja .asa{width:36px;height:4px;border-radius:2px;background:var(--mu);opacity:.5;margin:0 auto 12px}
.velo{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.tab{position:absolute;left:0;right:0;bottom:0;height:76px;background:var(--sf);display:flex;padding:6px 8px 18px;border-top:1px solid var(--ln)}
.tab span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu)}
.tab span.on{color:var(--fg)}
/* gantt */
.gt{position:relative}
.gt .r{display:flex;align-items:center;gap:8px;height:28px}
.gt .r .et{width:52px;font-size:12px;font-weight:700;color:var(--mu);display:flex;gap:4px;align-items:center}
.gt .r .pista{flex:1;position:relative;height:16px}
.gt .bl{position:absolute;top:0;height:16px;border-radius:4px;background:var(--wait)}
.gt .bl.m{background:var(--fg)}
.gt .ya{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ac);border-radius:1px}
.gt .un{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dotted var(--mu)}
.ley{display:flex;gap:14px;font-size:12px;font-weight:600;color:var(--mu);margin-top:6px;align-items:center}
.ley i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12.5px;line-height:1.5;white-space:pre-wrap;font-weight:500}
</style>
</head>
<body>
<div id="tel"></div>
<script src="icons.js"></script>
<script src="base.js"></script>
<script src="d1.js"></script>
<script src="d2.js"></script>
<script src="d3.js"></script>
<script src="d4.js"></script>
<script src="d5.js"></script>
<script src="d6.js"></script>
<script>
var q = new URLSearchParams(location.search);
document.documentElement.setAttribute("data-tema", q.get("t") || "oscuro");
var f = P[q.get("s")];
document.getElementById("tel").innerHTML = f ? f() : "<p>no existe " + q.get("s") + "</p>";
</script>
</body>
</html>
