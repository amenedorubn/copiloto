<script type="module">
import {render} from "/scripts/iconos3d/harness.js";
import {THREE,beamGeo,merge,mat,mesh,ground} from "/scripts/iconos3d/lib.js";
await render(({scene,cam})=>{
  const e=47, R=9;
  // cubo apoyado en un vertice: eje (1,1,1) vertical
  const V=[]; for(const a of [-1,1])for(const b of [-1,1])for(const c of [-1,1]) V.push(new THREE.Vector3(a,b,c).multiplyScalar(e/2));
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1,1,1).normalize(),new THREE.Vector3(0,1,0));
  const pts=V.map(v=>v.clone().applyQuaternion(q)); const C=new THREE.Vector3(0,0,0);
  const minY=Math.min(...pts.map(p=>p.y)); const lift=-minY+R+14;   // altura sobre el suelo (patas)
  pts.forEach(p=>p.y+=lift); C.y+=lift;
  const metal=new THREE.MeshStandardMaterial({color:0xdadada,roughness:.22,metalness:1});
  for(const p of [...pts,C]){ const m=mesh(new THREE.SphereGeometry(R,96,64),metal); m.position.copy(p); scene.add(m); }
  const tube=[]; 
  for(let i=0;i<8;i++){ tube.push(beamGeo(C.toArray(),pts[i].toArray(),1.7,24));
    for(let j=i+1;j<8;j++) if(Math.abs(V[i].distanceTo(V[j])-e)<0.01) tube.push(beamGeo(pts[i].toArray(),pts[j].toArray(),1.7,24)); }
  // patas: de las tres esferas inferiores al suelo
  const low=pts.map((p,i)=>({p,i})).sort((a,b)=>a.p.y-b.p.y).slice(1,4);
  for(const {p} of low){ const gx=p.x*1.25, gz=p.z*1.25; tube.push(beamGeo(p.toArray(),[gx,0,gz],1.9,24)); }
  scene.add(mesh(merge(tube),metal));
  ground(scene,330,.42);
  cam.position.set(150,50,420); cam.lookAt(0,lift+4,0);
},{env:1.0,shadowBox:260,sunPos:[-70,200,90],hemi:.35,sun:2.2,fill:.3,fov:22});
window.__done=true;
</script>
