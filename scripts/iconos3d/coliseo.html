<!doctype html><meta charset=utf-8><body style="margin:0;background:transparent">

<script type="module">
import {render} from "/scripts/iconos3d/harness.js";
import {THREE,boxGeo,merge,mat,mesh,ground} from "/scripts/iconos3d/lib.js";
// pseudoaleatorio estable
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
await render(({scene,cam})=>{
  const stone=mat(.66,.97), stoneDark=mat(.46,.97);
  const NB=80;
  const TH=[10.6,11.7,11.7,14.5];   // alturas de piso: tres arcadas y el atico (suman 48.5)
  const Y0=[0]; TH.forEach(h=>Y0.push(Y0[Y0.length-1]+h));
  // un tramo de muro (anchura w, grosor d) para el piso t
  function bay(w,t,d){
    const h=TH[t], sh=new THREE.Shape(); sh.moveTo(-w/2,0); sh.lineTo(w/2,0); sh.lineTo(w/2,h); sh.lineTo(-w/2,h); sh.lineTo(-w/2,0);
    if(t<3){ const aw=w*.58, ah=h*.74, r=aw/2; const p=new THREE.Path(); p.moveTo(-aw/2,0); p.lineTo(aw/2,0); p.lineTo(aw/2,ah-r); p.absarc(0,ah-r,r,0,Math.PI,false); p.lineTo(-aw/2,0); sh.holes.push(p); }
    else { const ww=w*.26, wh=h*.34; const p=new THREE.Path(); p.moveTo(-ww/2,h*.34); p.lineTo(ww/2,h*.34); p.lineTo(ww/2,h*.34+wh); p.lineTo(-ww/2,h*.34+wh); p.lineTo(-ww/2,h*.34); sh.holes.push(p); }
    const g=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false}); g.translate(0,0,-d); // cara exterior en z=0
    // cornisa saliente
    const c=new THREE.BoxGeometry(w+.1,1.0,1.6); c.translate(0,h-.5,.5); return merge([g,c]);
  }
  function ring(a,b,d,tiersFor,mt){
    const parts=[];
    for(let i=0;i<NB;i++){
      const th=2*Math.PI*i/NB, th2=2*Math.PI*(i+1)/NB, thm=(th+th2)/2;
      const P=new THREE.Vector3(a*Math.cos(thm),0,b*Math.sin(thm));
      const Pa=new THREE.Vector3(a*Math.cos(th),0,b*Math.sin(th)), Pb=new THREE.Vector3(a*Math.cos(th2),0,b*Math.sin(th2));
      const w=Pa.distanceTo(Pb)*1.003;
      const nrm=new THREE.Vector3(b*Math.cos(thm),0,a*Math.sin(thm)).normalize();
      const ang=Math.atan2(nrm.x,nrm.z);
      const nt=tiersFor(i,thm);
      for(let t=0;t<nt;t++){
        const g=bay(w,t,d); g.rotateY(ang); g.translate(P.x,Y0[t],P.z); parts.push(g);
      }
    }
    if(parts.length) scene.add(mesh(merge(parts),mt));
  }
  // altura del muro exterior segun el azimut: norte (z<0) entero, sur derrumbado con borde escalonado
  const A=94.5, Bm=78;
  const outerTiers=(i,th)=>{
    const deg=((th*180/Math.PI)+360)%360;            // 0=este(+x), 90=sur(+z), 270=norte
    // distancia angular al norte (270)
    let d=Math.abs(deg-270); if(d>180) d=360-d;
    if(d<=82) return 4;
    if(d<=92) return 3 + (i%2?0:1)*0;
    if(d<=100) return 2+ (rnd()<.5?1:0);
    if(d<=108) return 1+ (rnd()<.6?1:0);
    return 0;
  };
  ring(A,Bm,9,outerTiers,stone);
  // anillo interior (3 pisos), visible donde cae el exterior; mas bajo y con roturas
  const A2=A-17, B2=Bm-17;
  ring(A2,B2,8,(i,th)=>{ const deg=((th*180/Math.PI)+360)%360; let d=Math.abs(deg-270); if(d>180)d=360-d; return d<=90?3:(d<=125? (rnd()<.5?3:2):(rnd()<.5?2:1)); },stoneDark);
  // tercer anillo (muro de la cavea) y arena
  const A3=A-34, B3=Bm-34;
  ring(A3,B3,7,(i,th)=>{ const deg=((th*180/Math.PI)+360)%360; let d=Math.abs(deg-270); if(d>180)d=360-d; return d<=100?2:1; },stoneDark);
  // gradas: anillos escalonados descendiendo hacia la arena (en el lado derrumbado se ven)
  const E=[]; for(let k=0;k<6;k++){ const sa=A-34-k*5, sb=Bm-34-k*5; const sh=new THREE.Shape(); sh.absellipse(0,0,sa,sb,0,Math.PI*2,false,0); const hole=new THREE.Path(); hole.absellipse(0,0,sa-5,sb-5,0,Math.PI*2,true,0); sh.holes.push(hole);
    const g=new THREE.ExtrudeGeometry(sh,{depth:3+ (5-k)*1.5,bevelEnabled:false,curveSegments:96}); g.rotateX(-Math.PI/2); E.push(g); }
  scene.add(mesh(merge(E),mat(.6,.95)));
  // arena
  const ar=new THREE.Shape(); ar.absellipse(0,0,A-34-30,Bm-34-30,0,Math.PI*2,false,0);
  const ag=new THREE.ExtrudeGeometry(ar,{depth:1,bevelEnabled:false,curveSegments:96}); ag.rotateX(-Math.PI/2); scene.add(mesh(ag,mat(.8,1)));
  // hipogeo: muros bajos
  const H=[]; for(let i=-4;i<=4;i++){ H.push(boxGeo(i*7,1.6,0,.8,1.2,2*(Bm-70)*Math.sqrt(Math.max(0,1-(i*7/(A-64))**2)))); } scene.add(mesh(merge(H),stoneDark));
  ground(scene,520,.4);
  cam.position.set(-300,105,150); cam.lookAt(0,20,0);
},{env:.35,shadowBox:170,sunPos:[-120,190,220],hemi:.45,sun:3.0,fill:.22,fov:30});
window.__done=true;
</script>
